<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#B4472A">
<link rel="stylesheet" href="css/app.css">
<title>Mina sidor – EM-IT</title>
</head>
<body>
<header class="bar"><div class="bar-in">
<a class="brand" href="index.html"><i aria-hidden="true"></i>EM-IT <small>Mina sidor</small></a>
<div class="bar-right"><span id="who"></span><a id="adminlink" class="link" href="admin.html" hidden>Admin</a><button id="logout" class="link" type="button">Logga ut</button></div>
</div></header>
<main>
<div id="msg"></div>
<div id="content" hidden style="display:flex;flex-direction:column;gap:32px">
<div><h1>Hej! Så här ser det ut just nu.</h1><p id="summary" class="lead"></p></div>
<section aria-label="Status" id="services" class="row"></section>
<div class="cols">
<section class="card">
<div class="head"><h2>Ärenden och ändringar</h2><button id="newbtn" class="btn" type="button" aria-expanded="false">Nytt ärende</button></div>
<form id="ticketform" class="stack box" hidden>
<div class="f"><label for="t-cat">Vad gäller det?</label><select id="t-cat" name="category"><option value="hemsida">Hemsida</option><option value="it">IT</option></select></div>
<div class="f"><label for="t-title">Beskriv kort vad ni vill ha hjälp med</label><input id="t-title" name="title" type="text" maxlength="200" required></div>
<div class="f"><label for="t-desc">Mer detaljer (valfritt)</label><textarea id="t-desc" name="description" rows="4" maxlength="4000"></textarea></div>
<button class="btn" type="submit" style="align-self:flex-start">Skicka</button>
<div id="ticketmsg"></div>
</form>
<ul id="tickets" class="list"></ul>
</section>
<section class="card">
<h2>Fakturor</h2>
<div class="scroll"><table>
<thead><tr><th scope="col">Nr</th><th scope="col">Datum</th><th scope="col">Avser</th><th scope="col" class="r">Belopp</th><th scope="col" class="r">Status</th><th scope="col"><span style="position:absolute;left:-9999px">Fil</span></th></tr></thead>
<tbody id="invoices"></tbody>
</table></div>
<p class="lead" style="font-size:.9rem">Belopp exklusive moms.</p>
</section>
</div>
<section class="help"><h2>Vill ni hellre prata med oss?</h2><p>Ring 070-846 91 39 eller mejla support@em-it.se.</p></section>
</div>
</main>
<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/portal.js"></script>
</body>
</html>
