<p class="lead">Skriv e-postadressen som är registrerad hos oss, så skickar vi en länk som loggar in er. Inget lösenord behövs.</p>
<form id="loginform" class="card stack">
<div class="f"><label for="email">E-postadress</label><input id="email" name="email" type="email" autocomplete="email" required></div>

</form>
